services:
  api.session:
    image: api.session
    hostname: api-session
    restart: on-failure
    ports:
      - 8080:8080
    build:
      context: ../Api.Session
      dockerfile: "Dockerfile.Local"
    env_file:
      - .env
    networks:
      - network

networks:
  network:
    name: network
    driver: bridge
