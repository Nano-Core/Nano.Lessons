services:
  web.blank:
    image: web.blank
    hostname: web-blank
    restart: on-failure
    ports:
      - 8080:8080
    build:
      context: ../Web.Blank
      dockerfile: "Dockerfile.Local"
    env_file:
      - .env
    networks:
      - network

networks:
  network:
    name: network
    driver: bridge
